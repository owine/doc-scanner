name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm, Node, and install
        # v3 does the whole trio in one step: it installs pnpm (version from
        # `packageManager`), auto-detects the Node version from `.nvmrc`, and
        # runs `pnpm install` itself (`install` defaults to true). Do NOT add a
        # separate install step -- `require-lockfile: true` makes this one run
        # with `--frozen-lockfile` and fail outright if the lockfile is missing.
        # No `working-directory`: the install must run at the repo root so the
        # whole workspace is present for the `pnpm --filter` steps below.
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true

      - name: Typecheck (server)
        run: pnpm --filter @doc-scanner/server run typecheck

      - name: Test (server)
        run: pnpm --filter @doc-scanner/server test

      - name: Test (pwa)
        run: pnpm --filter @doc-scanner/pwa test

      - name: Build (pwa)
        run: pnpm --filter @doc-scanner/pwa run build

  docker-build:
    name: docker build (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Renovate's built-in github-actions manager CANNOT see these labels:
        # it reads `runs-on:` off parsed YAML, where this job's value is the
        # literal string `${{ matrix.runner }}` with no version in it
        # (confirmed by PR #209, which bumped the `runs-on:` above to 26.04 and
        # left both of these on 24.04 — a split-brain build that still passed,
        # since both runner images work).
        # They ARE tracked now, by a second `github-runners` customManager in
        # the shared preset (owine/renovate-config#103), which keys on the
        # `runner:` key and captures with the same shape as the built-in
        # manager, so these share a branch with the literal `runs-on:` deps and
        # both halves land in ONE PR. So do not bump them by hand — but keep
        # the shape: one line per label, `runner: <os>-<version>`, version's
        # first character a digit, suffix kept attached (`26.04-arm` is its own
        # datasource version, not `26.04` decorated). Renaming the key, moving
        # a label behind an env var, or splitting it across lines un-tracks it
        # again, silently and with no error anywhere.
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tags + history for `git describe`

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Compute image metadata
        id: meta
        # Keep identical to push-image's copy: these are build args, part of
        # the cache key that job's rebuild must hit. The commit date (not the
        # clock) makes BUILD_DATE the same in both jobs.
        run: |
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "build_date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(git describe --tags --always --dirty)"
          } >> "$GITHUB_OUTPUT"
        env:
          TZ: UTC

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # Loaded into the runner's Docker, so the smoke step can run it.
          load: true
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}
          tags: doc-scanner:ci
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke-test the OCR tools (${{ matrix.platform }})
        # The real ocrmypdf, img2pdf and Ghostscript in the built image. Catches
        # an apk bump that changes their output or exit codes, which the sidecar
        # check and the protected-PDF detection rely on. --init reaps killed tools.
        run: |
          docker run --rm --init \
            -v "$PWD/server/scripts:/app/server/scripts:ro" \
            --entrypoint sh doc-scanner:ci \
            -c "cd server && node --import tsx scripts/smoke-prepare.ts"

  push-image:
    name: push image (${{ matrix.platform }})
    # A job of its own because `permissions` can't be conditional: docker-build
    # runs PR code, so it must never hold a token that can write packages.
    # Runs on main only, after that platform's smoke test passed (needs
    # docker-build). Each platform pushes untagged, by digest; publish-image
    # joins the two into one multi-arch manifest and tags it.
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Same shape as docker-build's matrix, so Renovate's `github-runners`
        # customManager tracks these too (see the comment there).
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tags + history for `git describe`

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Compute image metadata
        id: meta
        # Keep identical to docker-build's copy (see there).
        run: |
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "build_date=$(git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(git describe --tags --always --dirty)"
          } >> "$GITHUB_OUTPUT"
        env:
          TZ: UTC

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.platform }} by digest
        id: push
        # docker-build just exported every layer to this cache scope with the
        # same build args, so this is cache hits plus an upload, not a rebuild.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job uploads the same name again; artifacts are
          # immutable unless replaced, and the re-run's digest is the one to use.
          overwrite: true

  publish-image:
    name: publish image
    # Needs `test` too: the image builds in parallel with the tests, but is
    # only tagged once they pass. A failed run leaves untagged digests, no tag.
    needs: [test, push-image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # One publish at a time, so the head check below and the tagging it guards
    # can't interleave with another run's.
    concurrency:
      group: publish-image
      cancel-in-progress: false

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check this commit is still main's head
        id: head
        # Runs finish out of order: an older commit's run that ends after a
        # newer one has published must not move `latest` back. It still gets
        # its sha tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.sha" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main")
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at ${head}; tagging sha only, not latest"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tags
        id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<short> for pinning a deploy, latest for following main.
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ steps.head.outputs.latest == 'true' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          METADATA_JSON: ${{ steps.tags.outputs.json }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          images=()
          for digest in *; do
            images+=("ghcr.io/${GITHUB_REPOSITORY}@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
