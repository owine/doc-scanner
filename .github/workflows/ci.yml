name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup pnpm, Node, and install
        # v3 does the whole trio in one step: it installs pnpm (version from
        # `packageManager`), auto-detects the Node version from `.nvmrc`, and
        # runs `pnpm install` itself (`install` defaults to true). Do NOT add a
        # separate install step -- `require-lockfile: true` makes this one run
        # with `--frozen-lockfile` and fail outright if the lockfile is missing.
        # No `working-directory`: the install must run at the repo root so the
        # whole workspace is present for the `pnpm --filter` steps below.
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Typecheck (server)
        run: pnpm --filter @doc-scanner/server run typecheck

      - name: Test (server)
        run: pnpm --filter @doc-scanner/server test

      - name: Test (pwa)
        run: pnpm --filter @doc-scanner/pwa test

      - name: Build (pwa)
        run: pnpm --filter @doc-scanner/pwa run build

  docker-build:
    name: docker build (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Renovate's built-in github-actions manager CANNOT see these labels:
        # it reads `runs-on:` off parsed YAML, where this job's value is the
        # literal string `${{ matrix.runner }}` with no version in it
        # (confirmed by PR #209, which bumped the `runs-on:` above to 26.04 and
        # left both of these on 24.04 — a split-brain build that still passed,
        # since both runner images work).
        # They ARE tracked now, by a second `github-runners` customManager in
        # the shared preset (owine/renovate-config#103), which keys on the
        # `runner:` key and captures with the same shape as the built-in
        # manager, so these share a branch with the literal `runs-on:` deps and
        # both halves land in ONE PR. So do not bump them by hand — but keep
        # the shape: one line per label, `runner: <os>-<version>`, version's
        # first character a digit, suffix kept attached (`26.04-arm` is its own
        # datasource version, not `26.04` decorated). Renaming the key, moving
        # a label behind an env var, or splitting it across lines un-tracks it
        # again, silently and with no error anywhere.
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    # packages: write is used on main only (the push steps are gated); PR runs
    # build and smoke-test without touching GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tags + history for `git describe`

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Compute image metadata
        id: meta
        run: |
          {
            echo "git_sha=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=$(git describe --tags --always --dirty)"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # Loaded into the runner's Docker, so the smoke step can run it.
          load: true
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}
          tags: doc-scanner:ci
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Smoke-test the OCR tools (${{ matrix.platform }})
        # The real ocrmypdf, img2pdf and Ghostscript in the built image. Catches
        # an apk bump that changes their output or exit codes, which the sidecar
        # check and the protected-PDF detection rely on. --init reaps killed tools.
        run: |
          docker run --rm --init \
            -v "$PWD/server/scripts:/app/server/scripts:ro" \
            --entrypoint sh doc-scanner:ci \
            -c "cd server && node --import tsx scripts/smoke-prepare.ts"

      # Main only, and only after the smoke test: an image that fails it never
      # reaches GHCR. Each platform pushes untagged, by digest; publish-image
      # below joins the two into one multi-arch manifest and tags it.
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.platform }} by digest
        if: github.ref == 'refs/heads/main'
        id: push
        # Same builder, context and build-args as the build above, so every
        # layer comes from buildkit's local cache and this step only uploads.
        # Keep the build-args identical: ARG values are part of the cache key.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: publish image
    # Needs `test` too: the image builds in parallel with the tests, but is
    # only tagged once they pass. A failed run leaves untagged digests, no tag.
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Two quick pushes to main must not finish out of order and move `latest`
    # back to the older commit: queue instead of running side by side.
    concurrency:
      group: publish-image
      cancel-in-progress: false

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<short> for pinning a deploy, latest for following main.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do
            images+=("ghcr.io/${{ github.repository }}@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}
