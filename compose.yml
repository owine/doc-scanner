# Production: runs a released image (CI builds it from main; publishing a
# GitHub Release tags it). The package is private, so the host needs
# `docker login ghcr.io` once (a token with read:packages).
# To build from source instead, add compose.build.yml:
#   docker compose -f compose.yml -f compose.build.yml up --build
services:
  app:
    # `latest` is the newest release. Set DOC_SCANNER_TAG to `1` (newest 1.x),
    # `1.0` (newest 1.0.x) or `1.0.0` (exact) to hold a series, to `main` to
    # follow every push to main, or to `sha-<full commit sha>` for one build.
    # `up` reuses a cached tag, so update with:
    #   docker compose pull && docker compose up -d
    image: ghcr.io/owine/doc-scanner:${DOC_SCANNER_TAG:-latest}
    # Loopback only: the app needs HTTPS (Secure cookie, camera, service
    # worker), so a reverse proxy on this host terminates TLS and forwards here.
    # It must accept 50 MB request bodies (the upload limit). If the proxy runs
    # in Docker, drop `ports` and put both on a shared network instead.
    ports: ["127.0.0.1:3000:3000"]
    # app.db and the encrypted inbox. Back it up together with
    # SESSION_ENCRYPTION_KEY: without the key, the queued files, sessions and
    # documents' names, paths and analyses can't be read. Some metadata, such
    # as sizes, hashes, MIME types, states and timestamps, is plain text.
    volumes: ["./data:/data"]
    environment:
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      ANALYZER_MODEL: ${ANALYZER_MODEL:-claude-haiku-5-5}
      ANALYZER_EFFORT: ${ANALYZER_EFFORT:-medium}
      AUTO_FILE_THRESHOLD: ${AUTO_FILE_THRESHOLD:-0.80}
      AUTO_FILE_ENABLED: ${AUTO_FILE_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "true"
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
      # Header mode (docs/superpowers/specs/2026-10-13-passkey-unlock-design.md):
      # the Authelia username. Set, the proxy's Remote-User signs requests in, so
      # a restart no longer signs you out and a passkey can unlock filing. The
      # proxy must overwrite or strip any client-sent Remote-User on every route
      # to the app, Authelia bypass rules included, and forward Authelia's
      # Remote-User response header (Traefik: authResponseHeaders: Remote-User;
      # nginx: auth_request_set $user $upstream_http_remote_user; then
      # proxy_set_header Remote-User $user;). Passkeys belong to the app's
      # hostname: change it and they must be added again. When Authelia's
      # session expires, the app says "Your sign-in has expired." with Reload.
      # Empty: the app's own sign-in.
      AUTH_PROXY_USER: ${AUTH_PROXY_USER:-}
      # Needed while `ports` publishes the app (even on 127.0.0.1): anything that
      # reaches the port could send a forged Remote-User. At least 32 characters;
      # the proxy sends it as X-Doc-Scanner-Proxy-Secret on every request
      # (Traefik: a headers middleware's customRequestHeaders; nginx:
      # proxy_set_header). Not needed when the port is unpublished and only the
      # proxy shares a network.
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:-}
      PWA_DIST_PATH: /app/pwa/dist
      # Optional error reporting (GlitchTip); empty disables it.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    healthcheck:
      # busybox wget; the image has no curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # One replica only: the document worker and the live Proton sessions are
    # in-process, so a second container would race the first.
    restart: unless-stopped
