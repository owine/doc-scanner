# Production: runs the image CI publishes from main. The package is private,
# so the host needs `docker login ghcr.io` once (a token with read:packages).
# To build from source instead, add compose.build.yml:
#   docker compose -f compose.yml -f compose.build.yml up --build
services:
  app:
    # `latest` follows main; pin a `sha-<short>` tag to hold a known-good build.
    image: ghcr.io/owine/doc-scanner:${DOC_SCANNER_TAG:-latest}
    # Loopback only: the app needs HTTPS (Secure cookie, camera, service
    # worker), so a reverse proxy on this host terminates TLS and forwards here.
    # It must accept 50 MB request bodies (the upload limit). If the proxy runs
    # in Docker, drop `ports` and put both on a shared network instead.
    ports: ["127.0.0.1:3000:3000"]
    # app.db and the encrypted inbox. Back it up together with
    # SESSION_ENCRYPTION_KEY: without the key, nothing in it can be read.
    volumes: ["./data:/data"]
    environment:
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      ANALYZER_MODEL: ${ANALYZER_MODEL:-claude-haiku-5-5}
      ANALYZER_EFFORT: ${ANALYZER_EFFORT:-medium}
      AUTO_FILE_THRESHOLD: ${AUTO_FILE_THRESHOLD:-0.80}
      AUTO_FILE_ENABLED: ${AUTO_FILE_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "true"
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
      PWA_DIST_PATH: /app/pwa/dist
      # Optional error reporting (GlitchTip); empty disables it.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    healthcheck:
      # busybox wget; the image has no curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # One replica only: the document worker and the live Proton sessions are
    # in-process, so a second container would race the first.
    restart: unless-stopped
